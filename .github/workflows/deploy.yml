name: Deploy via FTP

on:
  push:
    branches:
      - main # যে branch থেকে deploy করতে চান

jobs:
  web-deploy:
    name: Sync to Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # শুধু changed file sync করার জন্য

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./ # লাইভ সার্ভারের ডিরেক্টরি পাথ